<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="740" viewBox="0 0 1140 740" role="img" aria-labelledby="title description">
  <title id="title">代表5材質の手描き元色とWallTop暗色化結果の比較</title>
  <desc id="description">GrassLoam、DesertSand、Sandstone、Granite、Basaltについて、GroundTopと同じ手描き元色、0.85倍したWallTop外周生成色、共通WallInteriorDarkを示す。</desc>
  <rect width="1140" height="740" fill="#20242B"/>
  <text x="24" y="34" fill="#F1F3F5" font-family="sans-serif" font-size="20" font-weight="700">代表5材質 パレット用途プレビュー</text>
  <text x="24" y="58" fill="#AEB6C1" font-family="sans-serif" font-size="12">右列はsRGB各成分を0.85倍した生成結果。照明・面積比・ピクセル模様は含まない。</text>

  <g font-family="sans-serif">
    <g transform="translate(20 78)">
      <rect width="540" height="198" rx="8" fill="#292E37" stroke="#3A414D"/>
      <text x="16" y="27" fill="#F1F3F5" font-size="16" font-weight="700">GrassLoam / 草地ローム</text>
      <text x="16" y="51" fill="#C9D0DA" font-size="12" font-weight="700">GroundTop</text>
      <text x="286" y="51" fill="#C9D0DA" font-size="12" font-weight="700">生成Wall外周 ×0.85</text>
      <g font-size="11" fill="#E6E9ED">
        <rect x="16" y="62" width="18" height="18" fill="#6CAF4F"/><text x="42" y="76"><tspan font-family="monospace">#6CAF4F</tspan><tspan dx="10">草の影 20%</tspan></text>
        <rect x="16" y="88" width="18" height="18" fill="#76B655"/><text x="42" y="102"><tspan font-family="monospace">#76B655</tspan><tspan dx="10">暗い草 20%</tspan></text>
        <rect x="16" y="114" width="18" height="18" fill="#7FBD5C"/><text x="42" y="128"><tspan font-family="monospace">#7FBD5C</tspan><tspan dx="10">基調の草 20%</tspan></text>
        <rect x="16" y="140" width="18" height="18" fill="#88C363"/><text x="42" y="154"><tspan font-family="monospace">#88C363</tspan><tspan dx="10">明るい草 20%</tspan></text>
        <rect x="16" y="166" width="18" height="18" fill="#92CA6A"/><text x="42" y="180"><tspan font-family="monospace">#92CA6A</tspan><tspan dx="10">草の最明部 20%</tspan></text>
        <rect x="286" y="62" width="18" height="18" fill="#5C9543"/><text x="312" y="76"><tspan font-family="monospace">#5C9543</tspan><tspan dx="10">草の影 20%</tspan></text>
        <rect x="286" y="88" width="18" height="18" fill="#649B48"/><text x="312" y="102"><tspan font-family="monospace">#649B48</tspan><tspan dx="10">暗い草 20%</tspan></text>
        <rect x="286" y="114" width="18" height="18" fill="#6CA14E"/><text x="312" y="128"><tspan font-family="monospace">#6CA14E</tspan><tspan dx="10">基調の草 20%</tspan></text>
        <rect x="286" y="140" width="18" height="18" fill="#74A654"/><text x="312" y="154"><tspan font-family="monospace">#74A654</tspan><tspan dx="10">明るい草 20%</tspan></text>
        <rect x="286" y="166" width="18" height="18" fill="#7CAC5A"/><text x="312" y="180"><tspan font-family="monospace">#7CAC5A</tspan><tspan dx="10">草の最明部 20%</tspan></text>
      </g>
    </g>

