      <text x="16" y="27" fill="#F1F3F5" font-size="16" font-weight="700">全材質共通</text>
      <text x="16" y="51" fill="#C9D0DA" font-size="12" font-weight="700">WallInteriorDark</text>
      <rect x="16" y="66" width="72" height="72" fill="#0D1016" stroke="#515866"/>
      <text x="104" y="89" fill="#E6E9ED" font-family="monospace" font-size="14">#0D1016</text>
      <text x="104" y="114" fill="#E6E9ED" font-size="12">壁上面の内側を埋める共通暗色（中央領域100%）</text>
      <text x="104" y="136" fill="#AEB6C1" font-size="11">全材質共通・不透明。材質模様には使用しない。</text>
      <text x="16" y="174" fill="#AEB6C1" font-size="11">生成した外周色は、この暗色との境界もGameビューで確認する。</text>
    </g>
