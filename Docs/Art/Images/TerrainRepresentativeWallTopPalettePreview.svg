      <text x="16" y="27" fill="#F1F3F5" font-size="16" font-weight="700">Granite / 花崗岩</text>
      <text x="16" y="51" fill="#C9D0DA" font-size="12" font-weight="700">GroundTop</text>
      <text x="286" y="51" fill="#C9D0DA" font-size="12" font-weight="700">生成Wall外周 ×0.85</text>
      <g font-size="11" fill="#E6E9ED">
        <rect x="16" y="62" width="18" height="18" fill="#A69B95"/><text x="42" y="76"><tspan font-family="monospace">#A69B95</tspan><tspan dx="10">石基の影 12%</tspan></text>
        <rect x="16" y="88" width="18" height="18" fill="#ACA099"/><text x="42" y="102"><tspan font-family="monospace">#ACA099</tspan><tspan dx="10">暗い石基 18%</tspan></text>
        <rect x="16" y="114" width="18" height="18" fill="#B2A49D"/><text x="42" y="128"><tspan font-family="monospace">#B2A49D</tspan><tspan dx="10">基調の石基 45%</tspan></text>
        <rect x="16" y="140" width="18" height="18" fill="#B7A9A1"/><text x="42" y="154"><tspan font-family="monospace">#B7A9A1</tspan><tspan dx="10">明るい石基 15%</tspan></text>
        <rect x="16" y="166" width="18" height="18" fill="#8E9094"/><text x="42" y="180"><tspan font-family="monospace">#8E9094</tspan><tspan dx="10">暗い斑晶 10%</tspan></text>
        <rect x="286" y="62" width="18" height="18" fill="#8D847F"/><text x="312" y="76"><tspan font-family="monospace">#8D847F</tspan><tspan dx="10">石基の影 12%</tspan></text>
        <rect x="286" y="88" width="18" height="18" fill="#928882"/><text x="312" y="102"><tspan font-family="monospace">#928882</tspan><tspan dx="10">暗い石基 18%</tspan></text>
        <rect x="286" y="114" width="18" height="18" fill="#978B85"/><text x="312" y="128"><tspan font-family="monospace">#978B85</tspan><tspan dx="10">基調の石基 45%</tspan></text>
        <rect x="286" y="140" width="18" height="18" fill="#9C9089"/><text x="312" y="154"><tspan font-family="monospace">#9C9089</tspan><tspan dx="10">明るい石基 15%</tspan></text>
        <rect x="286" y="166" width="18" height="18" fill="#797A7E"/><text x="312" y="180"><tspan font-family="monospace">#797A7E</tspan><tspan dx="10">暗い斑晶 10%</tspan></text>
      </g>
    </g>

    <g transform="translate(20 510)">
      <rect width="540" height="198" rx="8" fill="#292E37" stroke="#3A414D"/>
      <text x="16" y="27" fill="#F1F3F5" font-size="16" font-weight="700">Basalt / 玄武岩</text>
      <text x="16" y="51" fill="#C9D0DA" font-size="12" font-weight="700">GroundTop</text>
      <text x="286" y="51" fill="#C9D0DA" font-size="12" font-weight="700">生成Wall外周 ×0.85</text>
      <g font-size="11" fill="#E6E9ED">
        <rect x="16" y="62" width="18" height="18" fill="#3D424B"/><text x="42" y="76"><tspan font-family="monospace">#3D424B</tspan><tspan dx="10">孔・亀裂 8%</tspan></text>
        <rect x="16" y="88" width="18" height="18" fill="#444A54"/><text x="42" y="102"><tspan font-family="monospace">#444A54</tspan><tspan dx="10">暗い石基 22%</tspan></text>
        <rect x="16" y="114" width="18" height="18" fill="#4C525D"/><text x="42" y="128"><tspan font-family="monospace">#4C525D</tspan><tspan dx="10">基調の石基 50%</tspan></text>
        <rect x="16" y="140" width="18" height="18" fill="#545B66"/><text x="42" y="154"><tspan font-family="monospace">#545B66</tspan><tspan dx="10">明るい石基 20%</tspan></text>
        <rect x="286" y="62" width="18" height="18" fill="#343840"/><text x="312" y="76"><tspan font-family="monospace">#343840</tspan><tspan dx="10">孔・亀裂 8%</tspan></text>
        <rect x="286" y="88" width="18" height="18" fill="#3A3F47"/><text x="312" y="102"><tspan font-family="monospace">#3A3F47</tspan><tspan dx="10">暗い石基 22%</tspan></text>
        <rect x="286" y="114" width="18" height="18" fill="#41464F"/><text x="312" y="128"><tspan font-family="monospace">#41464F</tspan><tspan dx="10">基調の石基 50%</tspan></text>
        <rect x="286" y="140" width="18" height="18" fill="#474D57"/><text x="312" y="154"><tspan font-family="monospace">#474D57</tspan><tspan dx="10">明るい石基 20%</tspan></text>
